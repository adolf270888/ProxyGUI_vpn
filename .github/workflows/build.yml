name: Build ProxyGUI VPN APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip build-essential ccache libltdl-dev libtool pkg-config autoconf automake curl
          pip install --upgrade pip
          pip install "buildozer>=1.5.1" cython

      - name: Download official HevSocks5Tunnel AAR
        run: |
          mkdir -p libs
          curl --fail --location --retry 4 --retry-delay 3 \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.20.0/hev-socks5-tunnel.aar \
            -o libs/hev-socks5-tunnel.aar
          unzip -t libs/hev-socks5-tunnel.aar
          unzip -l libs/hev-socks5-tunnel.aar | grep -E 'classes.jar|jni/arm64-v8a/libhev-socks5-tunnel.so|jni/armeabi-v7a/libhev-socks5-tunnel.so'

      - name: Install Android SDK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK_DIR/cmdline-tools"
          curl --fail --location --retry 4 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          rm -rf "$SDK_DIR/tools"
          ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          mkdir -p "$SDK_DIR/licenses"
          printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK_DIR/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK_DIR/licenses/android-sdk-preview-license"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Inspect AAR requirements
        run: |
          AAPT2=$ANDROID_HOME/build-tools/34.0.0/aapt2
          unzip -p libs/hev-socks5-tunnel.aar \
            META-INF/com/android/build/gradle/aar-metadata.properties \
            || echo 'AAR metadata file: none (no AGP constraints declared)'
          $AAPT2 dump badging libs/hev-socks5-tunnel.aar \
            | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" || true

      - name: Clone pinned p4a to a stable path
        run: |
          git clone -b v2024.01.21 --single-branch \
            https://github.com/kivy/python-for-android.git /home/runner/p4a

      - name: Patch p4a manifest and gradle templates
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p4a = Path('/home/runner/p4a')

          # 1) VPN-декларации в манифесте (как раньше)
          template = p4a / 'pythonforandroid/bootstraps/sdl2/build/templates/AndroidManifest.tmpl.xml'
          fragment = Path('src/android/extra_manifest_application.xml').read_text()
          src = template.read_text()
          if 'org.proxygui.proxygui.ProxyVpnService' not in src:
              marker = '</application>'
              if marker not in src:
                  raise SystemExit('marker </application> not found in template')
              template.write_text(src.replace(marker, fragment + '\n' + marker, 1))
          print('manifest template patched')

          # 2) flatDir-репозиторий: ищем gradle-шаблон рекурсивно
          candidates = sorted(p4a.glob('pythonforandroid/bootstraps/*/build/templates/*gradle*'))
          print('gradle template candidates:')
          for p in candidates:
              print('   ', p)
          gradle_tmpl = next((p for p in candidates
                              if 'repositories' in p.read_text()), None)
          if gradle_tmpl is None:
              raise SystemExit('gradle template not found — see candidates above')
          src = gradle_tmpl.read_text()
          if 'flatDir' not in src:
              new, n = re.subn(r"(allprojects\s*\{\s*repositories\s*\{)",
                               r"\1\n        flatDir { dirs 'libs' }",
                               src, count=1)
              if n == 0:
                  raise SystemExit('allprojects/repositories block not found in '
                                   + str(gradle_tmpl))
              gradle_tmpl.write_text(new)
          print('patched:', gradle_tmpl)
          PY

      - name: Verify Python and Java sources
        run: |
          python -m py_compile main.py
          test -f src/android/org/proxygui/proxygui/ProxyVpnService.java
          test -f libs/hev-socks5-tunnel.aar

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -n -B3 -A40 "FAILURE: Build failed" build.log | head -c 30000 || true
            grep -n -A40 "checkDebugAarMetadata" build.log | head -c 30000 || true
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proxygui-vpn-debug-apk
          path: bin/*.apk
          if-no-files-found: error
